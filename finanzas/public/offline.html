<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif;
         background: #f4efe6; color: #2e2922; text-align: center; padding: 24px; }
  @media (prefers-color-scheme: dark) { body { background: #1b1814; color: #efe6d8; } }
  button { margin-top: 16px; border: 0; border-radius: 16px; padding: 12px 20px; background: #5f6d33; color: #fbf8f1; font-weight: 600; font-size: 15px; }
</style>
</head>
<body>
  <div>
    <h1 style="font-weight:600">Sin conexión</h1>
    <p>Esta pantalla todavía no estaba guardada en el celular.<br>Abre el Inicio para ver tus datos y registrar movimientos: se envían cuando vuelva internet.</p>
    <button onclick="location.href='/'">Ir al inicio</button>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
