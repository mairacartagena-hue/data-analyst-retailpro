<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7c0116" />
    <title>A Medias · Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
             background: #fffde9; color: #47131c; font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
      .card { border: 3px solid #47131c; border-radius: 20px; padding: 24px; max-width: 360px; text-align: center; }
      h1 { font-family: Impact, "Arial Narrow", sans-serif; text-transform: uppercase; font-size: 34px; margin: 0 0 8px; }
      p { color: #8c5762; margin: 0 0 16px; }
      button { background: #7c0116; color: #fffde9; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 600; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Sin conexión</h1>
      <p>A Medias necesita internet para mostrar los datos al día de los dos.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
